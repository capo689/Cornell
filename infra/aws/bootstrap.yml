AWSTemplateFormatVersion: '2010-09-09'
Description: Bandboard container registry bootstrap resources.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: bandboard-api
      EmptyOnDelete: false
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the ten newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  GitHubOidcProviderArn:
    Value: !Ref GitHubOidcProvider
    Export:
      Name: bandboard-github-oidc-provider-arn
  ApiRepositoryUri:
    Description: ECR URI shared by the API and worker task definitions.
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: bandboard-api-repository-uri
