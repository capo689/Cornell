services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bandboard
      MYSQL_USER: bandboard
      MYSQL_PASSWORD: bandboard
      MYSQL_ROOT_PASSWORD: local-root-only
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-ubandboard",
          "-pbandboard",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  localstack:
    image: localstack/localstack:4.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fs http://localhost:4566/_localstack/init/ready | grep -q ''"state": "SUCCESSFUL"''',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bandboard
      DB_PASSWORD: bandboard
      DB_NAME: bandboard
      WEB_ORIGIN: http://localhost:8080
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_PUBLIC_ENDPOINT_URL: http://localhost:4566
      S3_PACKET_BUCKET: bandboard-packets
      SQS_QUEUE_NAME: bandboard-jobs
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bandboard
      DB_PASSWORD: bandboard
      DB_NAME: bandboard
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_PACKET_BUCKET: bandboard-packets
      SQS_QUEUE_NAME: bandboard-jobs
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:
