services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bandboard
      MYSQL_USER: bandboard
      MYSQL_PASSWORD: bandboard
      MYSQL_ROOT_PASSWORD: local-root-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubandboard", "-pbandboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bandboard
      DB_PASSWORD: bandboard
      DB_NAME: bandboard
      DB_SYNCHRONIZE: "true"
      WEB_ORIGIN: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:
